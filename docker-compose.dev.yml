# Dev loop, containerized — no host Node required.
#   docker compose -f docker-compose.dev.yml up
# App at http://localhost:3100 with hot reload.
services:
  mealmath-dev:
    # debian-based (not alpine): node_modules is bind-mounted and shared with the
    # host, and Next's SWC binaries are glibc/musl-specific
    image: node:22
    container_name: mealmath-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3100:3000"
    volumes:
      - ./:/app
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
